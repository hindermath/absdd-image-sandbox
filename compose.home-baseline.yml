services:
  ade:
    volumes:
      # Optional writable personal fork. It replaces the image's read-only
      # /opt/home-baseline reference; ~/home-baseline-source is the canonical
      # alias and ~/home-baseline-tmp remains a deprecated compatibility alias.
      - type: bind
        source: ${HOME_BASELINE_DIR:?Set HOME_BASELINE_DIR to your local home-baseline checkout}
        target: /opt/home-baseline
