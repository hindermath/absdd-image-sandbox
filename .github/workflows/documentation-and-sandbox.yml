name: Documentation and Sandbox Static Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-links:
    name: Markdown links and anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check exact immutable archive links in their original context
        shell: pwsh
        run: |
          ./scripts/tests/test-archived-markdown-links.ps1
          ./scripts/check-archived-markdown-links.ps1 -Repo .

      # The raw header is renderer input; its generated compendium remains checked.
      - name: Check local Markdown links and anchors with Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path scripts/templates/secure-development-compendium-header.md
            --exclude-path docs/security/agent-session-log
            --exclude-path scripts/tests/linked-intake-evidence
            --exclude-path '(^|/)specs/intake-series-archive/[^/]+/[^/]+/(order|requirements-order)\.md$'
            --exclude-path '^specs/intake-review-archive/505a9246-a7a7-4a37-9fe4-eb73f3a2705d/0ad06585-48d6-4e43-a7cc-714d580eef0e/report\.md$'
            --exclude-path '^specs/intake-review-archive/5c452360-9bf7-44d9-84e0-10cae34e72ea/1cadc99c-e344-4fc9-9fa0-78414f2d82cd/learner-review-marker\.md$'
            --exclude-path '^specs/intake-series-archive/65371068-4b1d-4465-9ce7-120e6b15b926/0ad06585-48d6-4e43-a7cc-714d580eef0e/requirements-index\.md$'
            './**/*.md'
          fail: true

  sandbox-static:
    name: Sandbox static contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Dockerfile pins and agent parity
        run: |
          python3 scripts/check-dockerfile-arg-renovate.py
          python3 scripts/check-home-baseline-lock.py
          python3 scripts/tests/test_home_baseline_reference_pin.py
          python3 scripts/tests/test_specify_container_patch.py

      - name: Check shell syntax
        run: |
          bash -n scripts/audit-export.sh
          bash -n scripts/agent-prompt.sh
          bash -n scripts/codex-bwrap-wrapper.sh
          bash -n scripts/smoke-test-toolchains.sh
          bash -n scripts/smoke-test-documentation.sh
          bash -n scripts/compose-down-with-audit.sh
          bash -n scripts/install-home-baseline-reference.sh
          bash -n scripts/check-container-architecture.sh
          bash -n scripts/sandbox-lifecycle.sh
          bash -n scripts/build-and-sbom.sh

      - name: Check agent prompt dispatcher parity
        run: |
          python3 scripts/tests/test_agent_prompt_dispatchers.py
          python3 scripts/tests/test_toolchain_preflight.py
          python3 scripts/tests/test_container_architecture.py

      - name: Check Home Baseline documentation boundary
        run: python3 scripts/tests/test_home_baseline_documentation_contract.py

      - name: Check optional template contracts
        run: python3 scripts/tests/test_template_profile.py
