title = "ade-dev-sandbox gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public Swift release PGP fingerprint in its exact Dockerfile assignment and captured provenance only"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^(Dockerfile|specs/intake-authoring-operations/3caff22f-59d5-4142-b15b-955ee96a3037/source-snapshots/Dockerfile\.txt)$''',
]
regexes = [
  '''^(?:\n)?[ \t]*swift_signing_key=(?:"52BB7E3DE28A71BE22EC05FFEF80A866B47A981F");[ \t]+\\[ \t]*\r?$''',
]

[[allowlists]]
description = "Exact public PowerShell source SHA-256 line in Feature 004 catalog"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^docs/security/secure-development/004-container-hardening-followup/interface-catalog\.json$''',
]
regexes = [
  '''"scripts/scan-agent-secrets\.ps1": "0e8b8035b2b94b41(?:)cef29989fc373561650ece571f5ba42a16e07ef984aac0c9"''',
]

[[allowlists]]
description = "Exact public shell source SHA-256 line in Feature 004 catalog"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^docs/security/secure-development/004-container-hardening-followup/interface-catalog\.json$''',
]
regexes = [
  '''"scripts/scan-agent-secrets\.sh": "47df3ba6f31038487de8e1ac52e2b79b8(?:)dca84ba6d0f5a60c4a9fde941a73b96"''',
]

[[allowlists]]
description = "Allow documented placeholder values in example files only"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)(\.env\.example|opencode\.env\.example|codex\.env\.example|codex\.config\.toml\.example)$''',
]
regexes = [
  '''(?i)\b(changeme|example|dummy|placeholder|your[-_ ]?(api[-_ ]?)?key)\b''',
]

[[allowlists]]
description = "Allow historical Swift secure-coding guidance term in imported baseline documentation"
condition = "AND"
regexTarget = "line"
commits = [
  "5d4ee4f9ba569acf4eeda1ae16d7753ebfddf39c",
  "ac425efa20f83e1980e6fe1dd5ff2ba88e1188dc",
]
paths = [
  '''^docs/secure-development/mitgeltende-dokumente/Leitlinie_Sichere-Programmierung\.md$''',
]
regexes = [
  '''Keychain/CryptoKit (use|Nutzung)''',
]

[[allowlists]]
description = "Allow historical documentation of forbidden private-key header markers"
condition = "AND"
regexTarget = "line"
commits = [
  "5d4ee4f9ba569acf4eeda1ae16d7753ebfddf39c",
  "ac425efa20f83e1980e6fe1dd5ff2ba88e1188dc",
]
paths = [
  '''^docs/secure-development/checklisten/CL_09_KI-Codeerzeugung\.md$''',
  '''^docs/secure-development/Checklistensammelband_Sichere-Entwicklung\.md$''',
]
regexes = [
  '''private SSH-Keys \(`[-]{5}BEGIN OPENSSH PRIVATE KEY[-]{5}`''',
]
