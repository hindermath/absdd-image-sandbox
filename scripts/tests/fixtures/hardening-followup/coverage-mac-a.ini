# DE: Alle zehn Python-Module; kein Ersatz fuer den 106-Dateien-Gesamtumfang.
# EN: All ten Python modules; not a substitute for the full 106-file scope.
[run]
branch = True
parallel = True
patch = subprocess
source_dirs =
    ${ADE_COVERAGE_REPO?}/scripts
    ${ADE_COVERAGE_REPO?}/spec-kit

[report]
include_namespace_packages = True
include =
    scripts/check-toolchain-pins.py
    scripts/check-home-baseline-lock.py
    scripts/lib/agentic_workspace_fleet.py
    scripts/lib/audit_retention.py
    scripts/lib/linux-maintenance-hardening.py
    scripts/lib/maintenance_container_worker.py
    scripts/lib/maintenance_execution_context.py
    scripts/lib/secure_development_hardening.py
    scripts/lib/workspace_storage_maintenance.py
    spec-kit/patch-specify-cli.py

[json]
show_contexts = True
